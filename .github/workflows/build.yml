name: Build game

# Builds the Windows game and the Android APK on every push.
# Download them from the run's "Artifacts" section on GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get downloaded assets (assets branch)
        run: |
          git fetch --depth 1 origin assets
          mkdir -p /tmp/assets && git archive FETCH_HEAD | tar -x -C /tmp/assets
          mkdir -p game/assets/vendor
          cp -r /tmp/assets/polyhaven game/assets/vendor/
          # Only the leaf textures of this tree are used; its mesh is film-quality.
          rm -f game/assets/vendor/polyhaven/models/jacaranda_tree/*.gltf
          du -sh game/assets/vendor

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sL -o g.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm g.zip
          curl -sL -o t.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q t.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ && rm -rf t.tpz templates

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          # Same signing key every build, so a new APK installs over the old one.
          cp tools/android/debug.keystore $HOME/debug.keystore

      - name: Import project
        working-directory: game
        run: |
          ~/godot/godot --headless --import --path . || true
          ~/godot/godot --headless --import --path . || true

      - name: Run world data tests
        working-directory: game
        run: ~/godot/godot --headless --path . -s res://tests/unit/world/world_data_test.gd

      - name: Export Windows
        working-directory: game
        run: |
          mkdir -p ../build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" ../build/windows/Openworld.exe
          test -f ../build/windows/Openworld.exe

      - name: Export Android
        working-directory: game
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          # Release build (smaller, faster) signed with the same fixed key.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p ../build/android
          ~/godot/godot --headless --path . --export-release "Android" ../build/android/Openworld.apk
          test -f ../build/android/Openworld.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Openworld-Android-APK
          path: build/android/Openworld.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Openworld-Windows
          path: build/windows/

      - name: Publish APK and Windows zip as the "latest" release (direct download, no unzip on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/windows && zip -q -r ../Openworld-Windows.zip . && cd ../..
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/android/Openworld.apk build/Openworld-Windows.zip \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. On a phone, tap Openworld.apk to download and install." --latest
