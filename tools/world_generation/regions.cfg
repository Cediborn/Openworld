# Heightmap recipes for tools/world_generation/heightgen (FastNoise2).
# Each region: a landscape recipe, its own seed, size in samples, metres per
# sample and the height range the 16-bit output maps to. `curve` > 1 flattens
# lowlands and sharpens peaks. Same seed = same terrain, always.

[green_valley]          # the Terrain3D test zone: rolling green hills around a valley
recipe = rolling_hills
seed = 4117
size = 512
spacing = 1
feature_size = 230
height_min = 0
height_max = 46
curve = 1.35

