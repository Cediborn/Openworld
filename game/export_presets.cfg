[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.bin, data/*.json"
exclude_filter="tools/*, tests/*, *_arm_1k.jpg, *_diff_1k.jpg, *jacaranda_tree_branches*, *jacaranda_tree_trunk*, *fir_sapling*, *flower_empodium*, *flower_gazania*, *flower_ursinia*, *weed_plant_02*, *periwinkle_plant*, *dead_quiver_trunk*, *rock_face_01*, *rock_face_02*, *stone_01*, *mossy_rock*"
export_path="../build/windows/Openworld.exe"

[preset.0.options]
debug/export_console_wrapper=2

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Openworld"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

